---
- name: set hosts
  hosts: localhost
  gather_facts: no
  tasks:
    - add_host:
        name: "{{ item }}"
        group: survey_hosts
      with_items:
        - '{{ survey_hosts.split(",") }}'
      ignore_errors: yes

- name: config web password auth
  hosts: survey_hosts
  vars:
    dir_path: /opt/{{ service_name }}
  gather_facts: no
  become: true
  tasks:

    - name: download httpd tools
      yum:
        name: httpd-tools
        state: present

    - name: create password
      shell: "htpasswd -c -B -b {{ dir_path }}/.htpasswd {{ prom_user }} {{ prom_pass }}"

    - name: register password
      shell: "cat {{ dir_path }}/.htpasswd | cut -d':' -f2-"
      register: hash_pass
    
    - name: create web file
      file:
        path: "{{ dir_path }}/web.yaml"
        state: touch
        mode: "0644"

    - name: edit web file
      copy:
        dest: "{{ dir_path }}/web.yaml"
        content: |
                  basic_auth_users:
                    {{ prom_user }}: {{ hash_pass.stdout }}

    - name: check if web.yml already in service file
      shell: "grep -q 'web.config' /etc/systemd/system/{{ service_name }}.service"
      register: web_found
      ignore_errors: yes    
        
    - name: edit service file
      replace: 
        path: "/etc/systemd/system/{{ service_name }}.service"
        regexp: '^ExecStart=(.*)$'
        replace: 'ExecStart=\1 --web.config.file={{ dir_path }}/web.yaml\r'
      when: web_found.rc != 0

    - name: remove ^M if occurs
      shell: "dos2unix /etc/systemd/system/{{ service_name }}.service"
      ignore_errors: yes

    - name: restart service
      systemd: 
        name: "{{ service_name }}.service"
        state: restarted
        enabled: yes
        daemon_reload: yes
