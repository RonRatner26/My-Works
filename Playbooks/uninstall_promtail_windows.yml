---
    - name: Uninstall Promtail Windows 
      hosts: localhost
      gather_facts: no
      
      tasks:
      - add_host: 
          name: "{{ item }}"
          group: "survey_hosts"
        with_items: 
          '{{ survey_hosts_windows.split('','') }}'
        when: survey_hosts_windows is defined and item != ''
    
    - name: Run tasks on hosts
      hosts: survey_hosts
      gather_facts: no
      tasks:

      - name: Stop service
        win_service:
          name: promtail
          state: stopped

      - name: Uninstall service using NSSM
        win_command: '"C:\Program Files\Promtail\nssm-2.24\win64\nssm.exe" remove promtail confirm'

      - name: Delete promtail folder forcefully
        win_file:
          path: "C:/Program Files/promtail"
          state: absent
        become: yes
