- name: Modify Windows Exporter
  hosts: localhost
  gather_facts: no
  
  tasks:
  - add_host: 
      name: "{{ item }}"
      group: "survey_hosts"
    with_items: 
      '{{ survey_hosts_windows.split('','') }}'
    when: survey_hosts_windows is defined and item != ''


- name: Run tasks on hosts
  hosts: survey_hosts
  gather_facts: no
  tasks:

  - name: Ensure widnows exporter directory exists
    win_file:
      path: "C:/Program Files/windows_exporter"
      state: directory

  - name: Format services string
    set_fact:
      formatted_services: "{{ services | regex_replace('([^,]+)', \"Name='\\1'\") | regex_replace(',', ' OR ') }}"

  - name: Create windows exporter config file
    win_copy:
      content: |
          collector:
            service:
              services-where: "{{ formatted_services }}"
      dest: "C:/Program Files/windows_exporter/config.yml"

  - name: Update windows exporter service to use config file
    win_command: sc config windows_exporter binPath="\"C:\Program Files\windows_exporter\windows_exporter.exe\" --config.file=\"C:\Program Files\windows_exporter\config.yml\" --log.file eventlog  --web.listen-address 0.0.0.0:9182"

  - name: Restart windows exporter service
    win_service:
        name: windows_exporter
        state: restarted

