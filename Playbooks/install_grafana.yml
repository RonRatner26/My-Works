---
- name: set hosts
  hosts: localhost
  gather_facts: no
  tasks:
    - add_host:
        name: "{{ item }}"
        group: grafana_new
      with_items:
        - '{{ survey_hosts.split(",") }}'
      ignore_errors: yes

- name: install grafana
  hosts: grafana_new
  vars:
    grafana_version: grafana-enterprise-11.0.0-1.x86_64.rpm
    gitlab_url: https://gitlab_url
    plugins_list:
        - "camptocamp-prometheus-alertmanager-datasource.zip"
        - "grafana-clickhouse-datasource-4.5.0.linux_amd64.zip"
        - "victoriametrics-logs-datasource-0.15.0.zip"
  gather_facts: no
  become: true
  tasks:
    ######## grafana install ##############

    - name: get install files from git
      get_url:
        url: "{{ gitlab_url }}/{{ item }}?inline=false"
        dest: "/tmp"   
        validate_certs: no
      loop: "{{ plugins_list + [grafana_version] }}"

    - name: install the grafana rpm
      yum:
        name: "/tmp/{{ grafana_version }}"
        state: present
        disable_gpg_check: true
      
    - name: check plugins dir
      file:
        path: /var/lib/grafana/plugins
        state: directory
        mode: 0755

    
    - name: unarchive plugins
      unarchive:
        src: "/tmp/{{ item }}"
        dest: "/var/lib/grafana/plugins"
        remote_src: true
      loop: "{{ plugins_list }}"

    - name: modify grafana config file
      lineinfile:
        path: /etc/grafana/grafana.ini
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backrefs: yes
      loop:
        - { regexp: '^;app_tls_skip_verify_insecure = false$' ,line: 'app_tls_skip_verify_insecure = true' }
        - { regexp: '^;allow_loading_unsigned_plugins =$' ,line: 'allow_loading_unsigned_plugins = victoriametrics-logs-datasource' }
        ##- { regexp: '^;http_port = 3000$' ,line: 'http_port = 80' }
        
    - name: Start grafana service
      systemd:
        name: grafana-server.service
        state: started
        enabled: yes
        daemon_reload: yes


    ########### nginx install ##############

    - name: install nginx
      yum:
        name: nginx
        state: present

    - name: config nginx
      blockinfile:
        path: /etc/nginx/nginx.conf
        insertafter: "^        location / {"
        block: |
          #
                      proxy_pass http://localhost:3000;
                      proxy_redirect off;
                      proxy_set_header Host $host;

    - name: Start nginx service
      systemd:
        name: nginx.service
        state: started
        enabled: yes
        daemon_reload: yes

    - name: check service status
      uri:
        url: http://localhost:80
        method: GET
        status_code: 200

    - name: Cleanup installer files
      file:
        state: absent
        path: "/tmp/{{ item }}"
      loop: "{{ plugins_list + [grafana_version] }}"
      