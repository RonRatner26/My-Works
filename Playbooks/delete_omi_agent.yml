---
    - name: Delete OMI Agent
      hosts: localhost
      gather_facts: no
      
      tasks:
      - add_host: 
          name: "{{ item }}"
          group: "survey_hosts"
        with_items: 
          '{{ survey_hosts_windows.split('','') }}'
        when: survey_hosts_windows is defined and item != ''
    
    - name: Run tasks on hosts
      hosts: survey_hosts
      gather_facts: no
      tasks:
      
      - name: Check if the agent exists
        win_shell: |
          Get-Service -Name "OvCtrl" -ErrorAction SilentlyContinue
        register: service_status
        ignore_errors: yes
    
      - name: Debug Agent status
        debug:
          msg: "The agent is not installed..."
        when: service_status.stdout.strip() == ""
    
      - name: Ending the playbook if the agent doesn't exists
        meta: end_play
        when: service_status.stdout.strip() == ""
    
      - name: Debug Agent status
        debug:
          msg: "The agent is installed"
    
      - name: Running Delete OMI Agent Command...
        win_command: cscript "C:\Program Files\HP\HP BTO Software\bin\win64\OpC\install\oainstall.vbs" -a -r
        register: command_output
    
      - name: Display command output
        debug:
          msg: "{{ item }}"
        with_items: "{{ command_output.stdout_lines }} "
    